<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>University Assignment Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f3f6fb; }
    .hero { background: linear-gradient(115deg, #12355b, #247ba0); color: white; }
    .card { border: 0; box-shadow: 0 0.4rem 1.5rem rgba(20, 45, 70, .08); }
    .description { min-width: 220px; max-width: 420px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <header class="hero py-4 mb-4">
    <div class="container">
      <p class="text-uppercase small mb-1">Student workspace</p>
      <h1 class="h2 mb-1">University Assignment Manager</h1>
      <p class="mb-0 opacity-75">Organize coursework, deadlines, and submission progress.</p>
    </div>
  </header>

  <main class="container pb-5">
    <div id="notice" class="alert d-none" role="alert"></div>
    <section class="card p-3 p-md-4 mb-4" aria-labelledby="form-title">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 id="form-title" class="h4 mb-0">Add an assignment</h2>
        <button id="cancel-edit" class="btn btn-outline-secondary btn-sm d-none" type="button">Cancel edit</button>
      </div>
      <form id="assignment-form" class="row g-3">
        <div class="col-md-3">
          <label for="course_code" class="form-label">Course code</label>
          <input id="course_code" name="course_code" class="form-control" maxlength="20" required placeholder="CS101">
        </div>
        <div class="col-md-5">
          <label for="title" class="form-label">Assignment title</label>
          <input id="title" name="title" class="form-control" maxlength="150" required placeholder="Algorithm analysis">
        </div>
        <div class="col-md-4">
          <label for="due_date" class="form-label">Due date</label>
          <input id="due_date" name="due_date" type="date" class="form-control" required>
        </div>
        <div class="col-md-8">
          <label for="description" class="form-label">Description</label>
          <textarea id="description" name="description" class="form-control" maxlength="2000" rows="2" required></textarea>
        </div>
        <div class="col-md-2">
          <label for="status" class="form-label">Status</label>
          <select id="status" name="status" class="form-select" required>
            <option>Not Started</option>
            <option>In Progress</option>
            <option>Submitted</option>
          </select>
        </div>
        <div class="col-md-2 d-flex align-items-end">
          <button id="save-button" class="btn btn-primary w-100" type="submit">Add assignment</button>
        </div>
      </form>
    </section>

    <section class="card p-3 p-md-4" aria-labelledby="list-title">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 id="list-title" class="h4 mb-0">Assignments</h2>
        <button id="refresh" class="btn btn-outline-primary btn-sm" type="button">Refresh</button>
      </div>
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead><tr><th>Course</th><th>Assignment</th><th>Description</th><th>Due</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="assignment-list"></tbody>
        </table>
      </div>
      <p id="empty-state" class="text-secondary text-center py-4 mb-0 d-none">No assignments yet.</p>
    </section>
  </main>

  <script>
    const form = document.querySelector("#assignment-form");
    const list = document.querySelector("#assignment-list");
    const notice = document.querySelector("#notice");
    const formTitle = document.querySelector("#form-title");
    const saveButton = document.querySelector("#save-button");
    const cancelButton = document.querySelector("#cancel-edit");
    let editingId = null;

    function showNotice(message, kind = "danger") {
      notice.textContent = message;
      notice.className = `alert alert-${kind}`;
    }

    function cell(text, className) {
      const element = document.createElement("td");
      element.textContent = text ?? "";
      if (className) element.className = className;
      return element;
    }

    async function request(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        headers: { "Content-Type": "application/json", ...options.headers }
      });
      if (!response.ok) {
        const detail = await response.json().catch(() => ({}));
        throw new Error(detail.error || `Request failed (${response.status})`);
      }
      return response.status === 204 ? null : response.json();
    }

    async function loadAssignments() {
      try {
        const assignments = await request("/api/assignments");
        list.replaceChildren();
        document.querySelector("#empty-state").classList.toggle("d-none", assignments.length !== 0);
        for (const assignment of assignments) {
          const row = document.createElement("tr");
          row.append(
            cell(assignment.course_code),
            cell(assignment.title),
            cell(assignment.description, "description"),
            cell(assignment.due_date),
            cell(assignment.status)
          );
          const actions = document.createElement("td");
          actions.className = "text-nowrap";
          const edit = document.createElement("button");
          edit.className = "btn btn-sm btn-outline-primary me-2";
          edit.type = "button";
          edit.textContent = "Edit";
          edit.addEventListener("click", () => beginEdit(assignment));
          const remove = document.createElement("button");
          remove.className = "btn btn-sm btn-outline-danger";
          remove.type = "button";
          remove.textContent = "Delete";
          remove.addEventListener("click", () => deleteAssignment(assignment.id));
          actions.append(edit, remove);
          row.append(actions);
          list.append(row);
        }
      } catch (error) {
        showNotice(`Could not load assignments: ${error.message}`);
      }
    }

    function beginEdit(assignment) {
      editingId = assignment.id;
      for (const field of ["course_code", "title", "description", "due_date", "status"]) {
        form.elements[field].value = assignment[field];
      }
      formTitle.textContent = "Edit assignment";
      saveButton.textContent = "Save changes";
      cancelButton.classList.remove("d-none");
      form.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    function resetForm() {
      editingId = null;
      form.reset();
      formTitle.textContent = "Add an assignment";
      saveButton.textContent = "Add assignment";
      cancelButton.classList.add("d-none");
    }

    async function deleteAssignment(id) {
      if (!window.confirm("Delete this assignment?")) return;
      try {
        await request(`/api/assignments/${id}`, { method: "DELETE" });
        showNotice("Assignment deleted.", "success");
        await loadAssignments();
      } catch (error) {
        showNotice(`Could not delete assignment: ${error.message}`);
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const payload = Object.fromEntries(
        ["course_code", "title", "description", "due_date", "status"]
          .map((field) => [field, form.elements[field].value])
      );
      try {
        await request(editingId ? `/api/assignments/${editingId}` : "/api/assignments", {
          method: editingId ? "PUT" : "POST",
          body: JSON.stringify(payload)
        });
        showNotice(editingId ? "Assignment updated." : "Assignment added.", "success");
        resetForm();
        await loadAssignments();
      } catch (error) {
        showNotice(`Could not save assignment: ${error.message}`);
      }
    });

    cancelButton.addEventListener("click", resetForm);
    document.querySelector("#refresh").addEventListener("click", loadAssignments);
    loadAssignments();
  </script>
</body>
</html>
