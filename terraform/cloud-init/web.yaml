#cloud-config
package_update: true
packages:
  - curl
  - git
  - nginx
  - netcat-openbsd
write_files:
  - path: /etc/nginx/conf.d/app.conf
    owner: root:root
    permissions: "0644"
    content: |
      server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        root /var/www/html;
        index index.html;

        location /api/ {
          proxy_pass http://10.2.1.4:5000;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
          try_files $uri $uri/ =404;
        }
      }
runcmd:
  - git clone --depth 1 '${repo_url}' /opt/university-source
  - cp -a /opt/university-source/${app_subdir}/frontend/. /var/www/html/
  - rm -f /etc/nginx/sites-enabled/default
  - nginx -t
  - systemctl enable --now nginx
